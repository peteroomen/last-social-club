<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Viewport check</title><style>body{margin:0;background:#888;color:white;font:16px sans-serif}nav{padding:10px}button{font:inherit;margin-right:10px}iframe{display:block;border:0;width:844px;height:390px;margin:10px}</style></head><body><nav><button onclick="size(844,390)">Phone landscape</button><button onclick="size(740,360)">Small landscape</button><button onclick="size(390,844)">Phone portrait</button><button onclick="size(960,432)">Fullscreen phone</button><select id="fixture"><option value="prepare">Prepare</option><option value="thirteen">13-card kitty</option><option value="challenge-trick">Challenge trick</option><option value="tool-shop">Tool shop</option><option value="auction">Auction</option><option value="insight">Insight choice</option><option value="joker">Joker lead</option><option value="gatekeeper">Gatekeeper</option><option value="last-card">Trick win</option><option value="workbench">Workbench</option><option value="inked-hand">Inked hand</option></select><button onclick="loadFixture()">Load fixture</button></nav><output id="geometry" style="display:block;font:12px monospace;max-width:960px">Layout check</output><output id="motion" style="display:block;font:12px monospace;max-width:960px">Motion trace</output><iframe allowfullscreen title="Game" src="/"></iframe><script>function size(w,h){const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px'}async function loadFixture(){const data=/* PREVIEW_FIXTURES */{};localStorage.setItem('last-social-club.v1',JSON.stringify(data[document.querySelector('#fixture').value]));document.querySelector('iframe').src='/';}document.querySelector('iframe').addEventListener('load',()=>{
 const doc=document.querySelector('iframe').contentDocument;const events=[];
 const audit={maxPlays:0,receiptsSeen:0,overlapEvents:0,offscreenEvents:0};
 const check=()=>{
  const rects=selector=>[...doc.querySelectorAll(selector)].map(el=>el.getBoundingClientRect());
  const hand=rects('.full-hand .playing-card'),plays=rects('.trick-play .playing-card'),feedback=rects('.score-receipt');
  const overlap=(a,b)=>a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top;
  const width=doc.documentElement.clientWidth,height=doc.documentElement.clientHeight;
  const outside=r=>r.left<-.5||r.right>width+.5||r.top<-.5||r.bottom>height+.5;
  audit.maxPlays=Math.max(audit.maxPlays,plays.length);audit.receiptsSeen+=feedback.length;audit.overlapEvents+=plays.concat(feedback).filter(p=>hand.some(h=>overlap(p,h))).length;audit.offscreenEvents+=hand.filter(outside).length;
  document.querySelector('#geometry').textContent=JSON.stringify({audit,clippedActions:[...doc.querySelectorAll('.action-panel button')].filter(el=>{const r=el.getBoundingClientRect(),p=el.closest('.action-panel').getBoundingClientRect();return r.top<p.top||r.bottom>p.bottom||r.left<p.left||r.right>p.right}).map(el=>el.textContent),viewport:[width,height],hand:hand.length,plays:plays.length,feedback:feedback.length,overlaps:plays.filter(p=>hand.some(h=>overlap(p,h))).length,receiptOverlaps:feedback.filter(p=>hand.some(h=>overlap(p,h))).length,offscreenCards:hand.filter(outside).length,scroll:[doc.documentElement.scrollWidth-width,doc.documentElement.scrollHeight-height]});
 };
 const observer=new MutationObserver(check);observer.observe(doc.body,{subtree:true,childList:true,attributes:true});doc.defaultView.addEventListener('resize',check);doc.addEventListener('transitionend',check);doc.addEventListener('animationend',check);check();
 doc.addEventListener('animationstart',event=>{
  if(!['winner-jolt','trick-zip','pencil-tally','bid-stamp'].includes(event.animationName))return;
  const el=event.target;events.push({animation:event.animationName,card:el.className,dx:el.style.getPropertyValue('--flight-x'),dy:el.style.getPropertyValue('--flight-y')});
  document.querySelector('#motion').textContent=JSON.stringify(events.slice(-8));
 });
});</script></body></html>

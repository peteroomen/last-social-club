<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Viewport check</title><style>body{margin:0;background:#888;color:white;font:16px sans-serif}nav{padding:10px}button{font:inherit;margin-right:10px}iframe{display:block;border:0;width:844px;height:390px;margin:10px}</style></head><body><nav><button onclick="size(844,390)">Phone landscape</button><button onclick="size(740,360)">Small landscape</button><button onclick="size(390,844)">Phone portrait</button><button onclick="size(960,432)">Fullscreen phone</button><select id="fixture"><option value="auction">Auction</option><option value="joker">Joker lead</option><option value="gatekeeper">Gatekeeper</option><option value="last-card">Trick win</option><option value="workbench">Workbench</option><option value="inked-hand">Inked hand</option></select><button onclick="loadFixture()">Load fixture</button></nav><output id="motion" style="display:block;font:12px monospace;max-width:960px">Motion trace</output><iframe allowfullscreen title="Game" src="/"></iframe><script>function size(w,h){const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px'}async function loadFixture(){const data=/* PREVIEW_FIXTURES */{};localStorage.setItem('last-social-club.v1',JSON.stringify(data[document.querySelector('#fixture').value]));document.querySelector('iframe').src='/';}document.querySelector('iframe').addEventListener('load',()=>{
 const doc=document.querySelector('iframe').contentDocument;const events=[];
 doc.addEventListener('animationstart',event=>{
  if(!['winner-jolt','trick-zip','pencil-tally','bid-stamp'].includes(event.animationName))return;
  const el=event.target;events.push({animation:event.animationName,card:el.className,dx:el.style.getPropertyValue('--flight-x'),dy:el.style.getPropertyValue('--flight-y')});
  document.querySelector('#motion').textContent=JSON.stringify(events.slice(-8));
 });
});</script></body></html>
